services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-civsight}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-civsight_pass}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - civsight_mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  postgis:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-civsight_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-civsight_pass}
      POSTGRES_DB: ${POSTGRES_DB:-civsight}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - civsight_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-civsight_user} -d ${POSTGRES_DB:-civsight}"]
      interval: 10s
      timeout: 5s
      retries: 5

  data-backend:
    build: ./data-backend
    restart: unless-stopped
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-civsight_user}:${POSTGRES_PASSWORD:-civsight_pass}@postgis:5432/${POSTGRES_DB:-civsight}
      NEARBY_RADIUS_METERS: ${NEARBY_RADIUS_METERS:-1000}
      AI_CONFIDENCE_THRESHOLD: ${AI_CONFIDENCE_THRESHOLD:-0.65}
      CORS_ORIGIN: ${FRONTEND_URL:-http://localhost:3000}
    ports:
      - "${DATA_API_PORT:-8002}:8000"
    volumes:
      - ./data-backend/data:/app/data

  ai-service:
    build:
      context: .
      dockerfile: Dockerfile.ai
    restart: unless-stopped
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY}
      ENVIRONMENT: ${ENVIRONMENT:-production}
    ports:
      - "${AI_API_PORT:-8001}:8001"

  node-api:
    build:
      context: .
      dockerfile: Dockerfile.node
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      NODE_ENV: ${ENVIRONMENT:-production}
      PORT: 5000
      HOST: 0.0.0.0
      MONGO_URI: mongodb://${MONGO_USER:-civsight}:${MONGO_PASSWORD:-civsight_pass}@mongodb:27017/${MONGO_DB:-civsight}?authSource=admin
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      CORS_ORIGIN: ${FRONTEND_URL:-http://localhost:3000}
      DATA_API_URL: http://data-backend:8000
      AI_API_URL: http://ai-service:8001
    ports:
      - "${NODE_API_PORT:-5000}:5000"

  frontend:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - node-api
      - data-backend
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - .:/usr/share/nginx/html:ro
    ports:
      - "${FRONTEND_PORT:-3000}:80"

volumes:
  civsight_mongo_data:
  civsight_postgres_data:
